name: Bug report (English)
description: Report stutter, folds, installation or language problems.
title: '[Bug] '
body:
- type: markdown
  attributes:
    value: Thanks for helping improve the beta. Clear reproduction steps help most. This issue and its
      attachments are public. Remove private paths, file names and notifications; do not upload a full
      backup.
- type: input
  id: version
  attributes:
    label: App version
    value: 0.4.11
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: What went wrong?
    options:
    - Dragging or stutter
    - Folds or fringe rendering
    - Saving, recovery or backup
    - Install, launch or quit
    - Window stacking, monitors or scaling
    - Language, text or layout
    - Something else
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: '1. Open the app…

      2. Drag the rug…

      3. The problem appears…'
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: What happened?
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What did you expect?
  validations:
    required: false
- type: input
  id: windows
  attributes:
    label: Windows version
    placeholder: Windows 11 24H2 / Windows 10 22H2 / Unknown
  validations:
    required: true
- type: dropdown
  id: movement
  attributes:
    label: Movement mode
    options:
    - 차분한 양탄자 / Calm
    - 기본 양탄자 / Classic
    - 두툼하고 묵직한 양탄자 / Thick & weighty
    - 모르겠음 / Not sure
  validations:
    required: false
- type: textarea
  id: rug
  attributes:
    label: Rug settings
    placeholder: Included design number or custom image, rug size, fringe on/off and fringe length
  validations:
    required: false
- type: textarea
  id: system
  attributes:
    label: PC and display details (if known)
    placeholder: CPU / GPU / monitor count / resolution / display scale (e.g. 150%)
  validations:
    required: false
- type: textarea
  id: evidence
  attributes:
    label: Screenshot, short clip or error excerpt (optional)
    description: Drag files here after hiding private information. Do not attach .yrbackup files or your
      complete settings.xml.
  validations:
    required: false
- type: checkboxes
  id: public-report
  attributes:
    label: Public report
    options:
    - label: I have removed private information that I do not want to publish.
      required: true
